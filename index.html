<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Apps & Fitness Software</title>
    <style>
        :root {
            --bg-color: #121214;
            --text-color: #f4f4f6;
            --accent-color: #ff5722; /* Велосипедный оранжевый цвет */
            --card-bg: #1e1e24;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
        }
        header {
            text-align: center;
            margin-bottom: 60px;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #fff;
        }
        header p {
            font-size: 1.2rem;
            color: #a0a0ab;
            margin-top: 0;
        }
        .apps-section h2 {
            font-size: 1.5rem;
            border-bottom: 2px solid var(--card-bg);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        .app-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #2a2a32;
            transition: transform 0.2s, border-color 0.2s;
        }
        .app-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }
        .app-card h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.4rem;
            color: #fff;
        }
        .app-card p {
            color: #c4c4cf;
            margin-bottom: 20px;
        }
        .links-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
        }
        .btn-primary:hover {
            background-color: #e64a19;
        }
        .btn-secondary {
            background-color: #2a2a32;
            color: #c4c4cf;
            border: 1px solid #3f3f46;
        }
        .btn-secondary:hover {
            background-color: #3f3f46;
            color: #fff;
        }
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #71717a;
            font-size: 0.85rem;
            border-top: 1px solid #1e1e24;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Mobile Applications</h1>
        </header>

        <section class="apps-section">
            <h2>Our Projects</h2>
            
            <!-- Карточка вашего текущего приложения -->
            <div class="app-card">
                <h3>[Application Name]</h3>
                <p>A smart, offline-first bicycle computer.</p>
                
                <div class="links-group">
                    <!-- Ссылка на Google Play (пока можно оставить # или пустой) -->
                    <a href="#" class="btn btn-primary">Available on Google Play</a>
                    <!-- Ссылка на политику безопасности в репозитории приложения -->
                    <a href="/racer/privacy/" class="btn btn-secondary">Privacy Policy</a>
                </div>
            </div>
            
        </section>
    </div>

    <footer>
        <p>&copy; 2026 Mobile Apps. All rights reserved.</p>
    </footer>

</body>
</html>
